openapi: 3.0.3
info:
  title: Bambuzle API
  description: |
    REST API for the Bambuzle 3D printer monitoring dashboard.

    Bambuzle connects to BambuLab printers via MQTT, collects telemetry (temperatures, layer progress, fan speeds),
    tracks print jobs, detects anomalies, and provides real-time state via WebSocket.

    ## Authentication
    Two separate layers:
    1. **Dashboard admin token** (who may use this API). Every `/api/*` route and the WebSocket require it, except
       `/api/session`, `/api/spec` and `/api/docs` (and the `/healthz` / `/readyz` probes, which live outside `/api`). Send `Authorization: Bearer <token>`, or exchange the token for an
       HttpOnly session cookie via `POST /api/session`. `BAMBUZLE_PUBLIC_READ=true` opens GETs and the WebSocket;
       `BAMBUZLE_AUTH=off` disables the check entirely.
    2. **BambuLab Cloud login** (the server's own connection to your printers), via `/api/auth/login`.

    ## Real-time Data
    For live updates, connect to the WebSocket endpoint at `ws://<host>:<port>/ws`.
    Messages are JSON with `{ type, data }` format. Types include `state`, `event`, and `auth`.
  version: 0.5.0
  contact:
    name: Bambuzle
  license:
    name: MIT

servers:
  - url: http://localhost:3000
    description: Local development

security:
  - bearerAuth: []
  - sessionCookie: []

tags:
  - name: Health
    description: Public liveness/readiness probes (no device details)
  - name: System
    description: Version, database stats, backups
  - name: Session
    description: Dashboard admin-token session
  - name: Auth
    description: BambuLab Cloud authentication
  - name: Printers
    description: Printer listing and live state
  - name: History
    description: Time-series samples and events
  - name: Jobs
    description: Print job tracking and history
  - name: Anomalies
    description: Anomaly data collection — layer transitions, temperature anomalies, job pauses
  - name: Alerts
    description: Alert rule management
  - name: Commands
    description: Send commands to printers via MQTT
  - name: Debug
    description: Diagnostic endpoints

paths:
  # ─── Health (public probes) ───

  /healthz:
    get:
      tags: [Health]
      summary: Liveness — the process can query SQLite
      security: []
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
        '503':
          description: Database query failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [error] }

  /readyz:
    get:
      tags: [Health]
      summary: 'Readiness — DB ok; Bambu Cloud / printer / backup problems report `degraded` (still 200)'
      security: []
      responses:
        '200':
          description: Ready (`ok`) or serving with problems (`degraded`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: 'Database unavailable (`status: unavailable`, only `checks.db` present)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'

  # ─── System ───

  /api/system:
    get:
      tags: [System]
      summary: Version, uptime, database size/row counts, backup schedule and last result
      responses:
        '200':
          description: System info
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  node: { type: string }
                  uptimeSec: { type: integer }
                  dataDir: { type: string }
                  db:
                    type: object
                    properties:
                      path: { type: string }
                      sizeBytes: { type: integer }
                      walBytes: { type: integer }
                      rowCounts:
                        type: object
                        properties:
                          samples: { type: integer }
                          events: { type: integer }
                          print_jobs: { type: integer }
                  backup:
                    type: object
                    properties:
                      schedule:
                        type: object
                        properties:
                          enabled: { type: boolean }
                          cron: { type: string }
                          dir: { type: string }
                          keep: { type: integer }
                          nextRun: { type: string, format: date-time, nullable: true }
                      last:
                        nullable: true
                        $ref: '#/components/schemas/BackupResult'
        '401':
          description: Admin token required

  /api/system/backup:
    post:
      tags: [System]
      summary: Run a verified online backup now
      description: |
        Writes `bambuzle-YYYYMMDD-HHMMSS.db` (UTC) via the SQLite online-backup API, verifies it with
        `PRAGMA integrity_check`, writes a `.sha256` sidecar and prunes to `backup.keep`.
        Concurrent requests share the in-flight run.
      responses:
        '200':
          description: Backup succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupResult'
        '401':
          description: Admin token required
        '500':
          description: 'Backup failed (`ok: false`, `error`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupResult'
        '503':
          description: Backups not configured

  /metrics:
    get:
      tags: [System]
      summary: Prometheus metrics (text exposition format 0.0.4)
      description: Requires the admin token unless BAMBUZLE_PUBLIC_READ=true. Labels are limited to configured printers.
      responses:
        '200':
          description: Metrics
          content:
            text/plain:
              schema: { type: string }
        '401':
          description: Admin token required

  # ─── Session (dashboard admin token) ───

  /api/session:
    get:
      tags: [Session]
      summary: Whether this client must enter the admin token
      security: []
      responses:
        '200':
          description: Session state
          content:
            application/json:
              schema:
                type: object
                properties:
                  required: { type: boolean }
                  authenticated: { type: boolean }
                  publicRead: { type: boolean }
    post:
      tags: [Session]
      summary: Exchange the admin token for a session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Signed in; sets the `bambuzle_session` HttpOnly cookie
        '401':
          description: Invalid admin token
        '429':
          description: Too many attempts
    delete:
      tags: [Session]
      summary: Sign this browser out
      security: []
      responses:
        '200':
          description: Cookie cleared

  # ─── Auth ───

  /api/auth/status:
    get:
      tags: [Auth]
      summary: Get authentication status
      responses:
        '200':
          description: Current auth state
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [authenticated, needs_login, needs_verification]

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login with BambuLab credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [authenticated, needs_verification]
                  message:
                    type: string
        '400':
          description: Missing credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/verify:
    post:
      tags: [Auth]
      summary: Complete login with verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: Verification code sent to email
      responses:
        '200':
          description: Verification successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: authenticated
        '401':
          description: Invalid code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Clear authentication
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: needs_login

  # ─── Printers ───

  /api/printers:
    get:
      tags: [Printers]
      summary: List all printers with live state
      description: Returns all registered printers with their database info, live MQTT state, and connection status.
      responses:
        '200':
          description: Array of printers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Printer'

  # ─── History ───

  /api/printers/{deviceId}/history:
    get:
      tags: [History]
      summary: Get temperature/progress samples
      description: Time-series telemetry samples for a printer. Defaults to most recent 5000 samples.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: from
          in: query
          schema:
            type: string
            format: date-time
          description: Start of time window (ISO 8601)
        - name: to
          in: query
          schema:
            type: string
            format: date-time
          description: End of time window (ISO 8601)
        - name: limit
          in: query
          schema:
            type: integer
            default: 5000
          description: Maximum number of samples to return
      responses:
        '200':
          description: Array of samples
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sample'

  /api/printers/{deviceId}/events:
    get:
      tags: [History]
      summary: Get events for a printer
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 200
      responses:
        '200':
          description: Array of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'

  /api/events:
    get:
      tags: [History]
      summary: Get recent events across all printers
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Array of events with printer names
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Event'
                    - type: object
                      properties:
                        printer_name:
                          type: string

  # ─── Jobs ───

  /api/printers/{deviceId}/jobs:
    get:
      tags: [Jobs]
      summary: Get print job history
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Array of print jobs (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrintJob'

  /api/stats:
    get:
      tags: [Jobs]
      summary: Print job statistics (totals, success rates, by printer / material / day)
      description: |
        Aggregates print jobs whose `started_at` falls within [from, to]. Defaults to the last 30 days.
        Cancelled = end_state `CANCELLED` (user cancel) or legacy `IDLE`. `successRate` = finished / (finished + failed + cancelled), null when 0.
        Durations are wall-clock (pauses included); rows without `duration_sec` fall back to ended_at − started_at.
        Days in `byDay` are UTC.
      parameters:
        - name: printer
          in: query
          description: Restrict to one printer (device ID)
          schema:
            type: string
        - name: from
          in: query
          description: Window start (ISO 8601 date or date-time; offset-less values are UTC). Default now − 30 days.
          schema:
            type: string
            example: '2026-09-01'
        - name: to
          in: query
          description: Window end (ISO 8601; a bare date means the end of that UTC day). Default now.
          schema:
            type: string
            example: '2026-10-01T12:00:00Z'
      responses:
        '200':
          description: Job statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStats'
        '400':
          description: Invalid from/to (not ISO 8601, impossible date, or from after to)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/export/jobs:
    get:
      tags: [Jobs]
      summary: Download print history (one row per job) as CSV or JSON
      description: |
        BAM-46. Jobs whose `started_at` falls within [from, to], oldest first. Default window: all time up to now.
        Column set is versioned (`schema_version` 1, also sent as `X-Bambuzle-Export-Schema`); every column is
        described in `docs/export-data-dictionary.md`. Timestamps are ISO 8601 UTC (`Z`).
        At most 50,000 rows: when more match, the newest 50,000 are returned, `X-Bambuzle-Truncated: true` is set
        and JSON carries `truncated: true`.
        CSV is RFC 4180 with a UTF-8 BOM and CRLF line endings; text cells starting with `= + - @`, tab or CR are
        prefixed with `'` (spreadsheet formula-injection guard). Numeric cells are never prefixed. JSON values are raw.
      parameters:
        - name: format
          in: query
          description: Output format
          schema:
            type: string
            enum: [csv, json]
            default: csv
        - name: printer
          in: query
          description: Restrict to one printer (device ID)
          schema:
            type: string
        - name: from
          in: query
          description: Window start (ISO 8601 date or date-time; offset-less values are UTC). Default unbounded.
          schema:
            type: string
            example: '2026-09-01'
        - name: to
          in: query
          description: Window end (ISO 8601; a bare date means the end of that UTC day). Default now.
          schema:
            type: string
            example: '2026-10-01'
      responses:
        '200':
          description: Export file (sent with `Content-Disposition attachment; filename="bambuzle-jobs-<from|all>-<to>.csv|json"`)
          headers:
            X-Bambuzle-Truncated:
              description: Present (`true`) only when rows were dropped by the 50,000-row cap
              schema:
                type: string
            X-Bambuzle-Export-Schema:
              description: Export schema_version
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: object
                properties:
                  schema_version:
                    type: integer
                    example: 1
                  generated_at:
                    type: string
                    format: date-time
                  window:
                    type: object
                    properties:
                      from:
                        type: string
                        format: date-time
                        nullable: true
                      to:
                        type: string
                        format: date-time
                      printer:
                        type: string
                        nullable: true
                  truncated:
                    type: boolean
                  max_rows:
                    type: integer
                  columns:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        type:
                          type: string
                          enum: [string, integer, number]
                        unit:
                          type: string
                  jobs:
                    type: array
                    description: One object per job, keys in `columns` order
                    items:
                      type: object
                      additionalProperties: true
        '400':
          description: Invalid format, printer or from/to
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ─── Anomalies ───

  /api/printers/{deviceId}/jobs/{jobId}/layers:
    get:
      tags: [Anomalies]
      summary: Get layer transitions for a job
      description: |
        One row per layer change detected at MQTT-message granularity.
        Includes a snapshot of temperatures, speed, and progress at each layer transition,
        plus the duration since the previous layer.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Array of layer transitions ordered by layer number
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LayerTransition'

  /api/printers/{deviceId}/jobs/{jobId}/anomalies:
    get:
      tags: [Anomalies]
      summary: Get temperature anomalies for a job
      description: |
        Only stores anomalous readings where deviation from target exceeds the configured
        threshold OR rate of change exceeds the configured threshold. Normal readings stay
        in the samples table.

        Deviation is signed: negative = undershoot, positive = overshoot.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Array of temperature anomalies ordered by timestamp
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TempAnomaly'

  /api/printers/{deviceId}/jobs/{jobId}/pauses:
    get:
      tags: [Anomalies]
      summary: Get pause records for a job
      description: |
        Individual pause records with context about what caused the pause.
        Tracks both user-initiated pauses and error-induced pauses (when HMS errors are active).
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Array of pause records ordered by pause time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobPause'

  /api/printers/{deviceId}/anomalies:
    get:
      tags: [Anomalies]
      summary: Get temperature anomalies in a time window
      description: |
        Returns temperature anomalies for a printer within a time window, regardless of job.
        Useful for anomaly overlay when browsing arbitrary time ranges.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Start of time window (ISO 8601)
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: End of time window (ISO 8601)
      responses:
        '200':
          description: Array of temperature anomalies ordered by timestamp
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TempAnomaly'
        '400':
          description: Missing required query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/printers/{deviceId}/pauses:
    get:
      tags: [Anomalies]
      summary: Get job pauses in a time window
      description: |
        Returns pause records for a printer within a time window, regardless of job.
        Useful for pause band overlay when browsing arbitrary time ranges.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Start of time window (ISO 8601)
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: End of time window (ISO 8601)
      responses:
        '200':
          description: Array of pause records ordered by pause time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobPause'
        '400':
          description: Missing required query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ─── Commands ───

  /api/printers/{deviceId}/command:
    post:
      tags: [Commands]
      summary: Send command to printer
      description: |
        Sends a command via cloud MQTT and waits up to 4 s for the printer's reply (matched by sequence_id).
        State-gated: pause needs RUNNING/PREPARE, resume needs PAUSE, stop/set_speed need an active print.
        Every attempt (including rejections) is recorded as a `command` event. Firmware with Bambu's
        authorization control may refuse unsigned commands — that surfaces as `ok:false` with the printer's reason.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command:
                  type: string
                  enum: [pause, resume, stop, set_speed]
                param:
                  description: Command parameter (e.g. speed level 1-4 for set_speed)
                  oneOf:
                    - type: string
                    - type: integer
      responses:
        '200':
          description: Command sent (check `acknowledged` / `ok` for the printer's answer)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, description: 'sent and not rejected by the printer' }
                  sent: { type: boolean }
                  acknowledged: { type: boolean, description: 'printer replied within 4 s' }
                  result: { type: string, nullable: true }
                  reason: { type: string, nullable: true }
                  outcome: { type: string }
        '409':
          description: Command not valid in the printer's current state
        '502':
          description: Could not publish (printer connection dropped)
        '503':
          description: Server not logged into BambuLab Cloud
        '400':
          description: Unknown command or invalid speed level
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Printer not found or not connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ─── Alerts ───

  /api/alerts:
    get:
      tags: [Alerts]
      summary: List all alert rules
      responses:
        '200':
          description: Array of alert rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertRule'
    post:
      tags: [Alerts]
      summary: Create an alert rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleInput'
      responses:
        '201':
          description: Created alert rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/alerts/{alertId}:
    get:
      tags: [Alerts]
      summary: Get a single alert rule
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Alert rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Alerts]
      summary: Update an alert rule
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleInput'
      responses:
        '200':
          description: Updated alert rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Alerts]
      summary: Delete an alert rule
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ─── Debug ───

  /api/printers/{deviceId}/debug/mqtt:
    get:
      tags: [Debug]
      summary: Get raw MQTT merged state
      description: Returns the full merged MQTT state object for diagnostics. This is the raw data before extraction.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Raw MQTT state
          content:
            application/json:
              schema:
                type: object
                properties:
                  deviceId:
                    type: string
                  connected:
                    type: boolean
                  mergedState:
                    type: object
                    description: Full raw MQTT merged state (printer-dependent structure)
        '404':
          description: Printer not found or not connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Dashboard admin token (BAMBUZLE_ADMIN_TOKEN or <data dir>/admin-token)
    sessionCookie:
      type: apiKey
      in: cookie
      name: bambuzle_session
  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
      description: Printer device ID
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: integer
      description: Print job ID

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

    Readiness:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        checks:
          type: object
          properties:
            db:
              type: object
              properties:
                ok: { type: boolean }
            cloudAuth:
              type: object
              properties:
                status: { type: string, enum: [authenticated, needs_login, needs_verification, unknown] }
            printers:
              type: object
              properties:
                configured: { type: integer }
                connected: { type: integer }
            backup:
              type: object
              properties:
                enabled: { type: boolean }
                lastOk: { type: boolean, nullable: true, description: null if none yet or only found on disk after a restart }
                lastAgeSec: { type: integer, nullable: true }

    BackupResult:
      type: object
      properties:
        ok: { type: boolean, nullable: true }
        path: { type: string, nullable: true }
        time: { type: string, format: date-time }
        size: { type: integer, nullable: true }
        sha256: { type: string }
        durationMs: { type: integer }
        pruned: { type: integer }
        error: { type: string }
        source: { type: string, enum: [disk], description: Present when seeded from the newest file on disk at startup }

    Printer:
      type: object
      properties:
        device_id:
          type: string
        name:
          type: string
        model:
          type: string
        nozzle_diameter:
          type: number
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        connected:
          type: boolean
        live:
          nullable: true
          $ref: '#/components/schemas/LiveState'

    LiveState:
      type: object
      description: Extracted printer state from MQTT
      properties:
        gcodeState:
          type: string
          enum: [IDLE, RUNNING, PAUSE, FINISH, FAILED, PREPARE, SLICING, UNKNOWN]
        gcodeFile:
          type: string
        subtaskName:
          type: string
        taskId:
          type: string
        progress:
          type: number
          nullable: true
          description: Print progress percentage (0-100)
        remainingMin:
          type: integer
          nullable: true
          description: Estimated remaining time in minutes
        layerNum:
          type: integer
          nullable: true
        totalLayers:
          type: integer
          nullable: true
        nozzleTemp:
          type: number
          nullable: true
        nozzleTarget:
          type: number
          nullable: true
        nozzle2Temp:
          type: number
          nullable: true
          description: Second nozzle temperature (H2D dual-nozzle printers)
        nozzle2Target:
          type: number
          nullable: true
        extruderCount:
          type: integer
        bedTemp:
          type: number
          nullable: true
        bedTarget:
          type: number
          nullable: true
        chamberTemp:
          type: number
          nullable: true
        partFanSpeed:
          type: integer
          nullable: true
          description: Part cooling fan speed (0-100%)
        auxFanSpeed:
          type: integer
          nullable: true
          description: Auxiliary fan speed (0-100%)
        chamberFanSpeed:
          type: integer
          nullable: true
          description: Chamber fan speed (0-100%)
        speedLevel:
          type: integer
          nullable: true
          description: "Speed preset: 1=Silent, 2=Standard, 3=Sport, 4=Ludicrous"
        wifiSignal:
          type: integer
          nullable: true
          description: WiFi signal strength (dBm)
        hmsErrors:
          type: array
          items:
            type: object
        ams:
          type: object
          nullable: true
          description: AMS (Automatic Material System) state

    Sample:
      type: object
      properties:
        id:
          type: integer
        device_id:
          type: string
        job_id:
          type: integer
          nullable: true
        ts:
          type: string
          format: date-time
        bed_temp:
          type: number
          nullable: true
        bed_target:
          type: number
          nullable: true
        nozzle_temp:
          type: number
          nullable: true
        nozzle_target:
          type: number
          nullable: true
        nozzle2_temp:
          type: number
          nullable: true
        nozzle2_target:
          type: number
          nullable: true
        chamber_temp:
          type: number
          nullable: true
        part_fan_speed:
          type: integer
          nullable: true
        aux_fan_speed:
          type: integer
          nullable: true
        chamber_fan_speed:
          type: integer
          nullable: true
        progress:
          type: number
          nullable: true
        layer_num:
          type: integer
          nullable: true
        total_layers:
          type: integer
          nullable: true
        remaining_min:
          type: integer
          nullable: true
        gcode_state:
          type: string
        speed_level:
          type: integer
          nullable: true
        wifi_signal:
          type: integer
          nullable: true

    Event:
      type: object
      properties:
        id:
          type: integer
        device_id:
          type: string
        job_id:
          type: integer
          nullable: true
        ts:
          type: string
          format: date-time
        event_type:
          type: string
          enum: [state_change, hms_error, print_error, alert_fired, command]
        severity:
          type: string
          enum: [info, warning, error]
        code:
          type: string
          nullable: true
          description: HMS error code (for hms_error events)
        message:
          type: string

    PrintJob:
      type: object
      properties:
        id:
          type: integer
        device_id:
          type: string
        task_id:
          type: string
          nullable: true
        subtask_name:
          type: string
          nullable: true
        gcode_file:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        end_state:
          type: string
          nullable: true
          enum: [FINISH, FAILED, CANCELLED, IDLE]
        progress_pct:
          type: number
          nullable: true
        pause_count:
          type: integer
          description: Number of times the job was paused
        total_pause_sec:
          type: number
          description: Total seconds spent paused
        anomaly_count:
          type: integer
          description: Number of temperature anomalies detected during this job
        hms_codes:
          type: string
          nullable: true
          description: JSON array of HMS error codes seen during this job
        total_layers:
          type: integer
          nullable: true
          description: Total layer count for the print
        material:
          type: string
          nullable: true
          description: Active AMS tray filament type at job start (null if unknown / external spool)
        material_color:
          type: string
          nullable: true
          description: Active AMS tray colour (RRGGBBAA hex) at job start
        duration_sec:
          type: integer
          nullable: true
          description: Wall-clock job duration, set when the job ends

    JobStatCounters:
      type: object
      properties:
        jobs:
          type: integer
        finished:
          type: integer
        failed:
          type: integer
        cancelled:
          type: integer
          description: Jobs that ended in IDLE (cancelled/aborted)
        running:
          type: integer
          description: Jobs with no end yet
        successRate:
          type: number
          nullable: true
          description: finished / (finished + failed + cancelled); null when no completed jobs
        totalPrintHours:
          type: number
        avgDurationMin:
          type: number
          nullable: true
          description: Mean duration of ended jobs, minutes

    JobStats:
      type: object
      properties:
        window:
          type: object
          properties:
            from:
              type: string
              description: UTC, 'YYYY-MM-DD HH:MM:SS'
            to:
              type: string
            printer:
              type: string
              nullable: true
        overall:
          $ref: '#/components/schemas/JobStatCounters'
        byPrinter:
          type: array
          items:
            allOf:
              - type: object
                properties:
                  deviceId:
                    type: string
                  name:
                    type: string
              - $ref: '#/components/schemas/JobStatCounters'
        byMaterial:
          type: array
          items:
            allOf:
              - type: object
                properties:
                  material:
                    type: string
                    description: Filament type (e.g. PLA), or 'Unknown'
              - $ref: '#/components/schemas/JobStatCounters'
        byDay:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              finished:
                type: integer
              failed:
                type: integer
              cancelled:
                type: integer

    LayerTransition:
      type: object
      properties:
        id:
          type: integer
        device_id:
          type: string
        job_id:
          type: integer
          nullable: true
        layer_num:
          type: integer
        ts:
          type: string
          format: date-time
        duration_sec:
          type: number
          nullable: true
          description: Seconds since previous layer transition (null for first layer)
        nozzle_temp:
          type: number
          nullable: true
        nozzle_target:
          type: number
          nullable: true
        bed_temp:
          type: number
          nullable: true
        bed_target:
          type: number
          nullable: true
        chamber_temp:
          type: number
          nullable: true
        speed_level:
          type: integer
          nullable: true
        progress:
          type: number
          nullable: true

    TempAnomaly:
      type: object
      properties:
        id:
          type: integer
        device_id:
          type: string
        job_id:
          type: integer
          nullable: true
        ts:
          type: string
          format: date-time
        sensor:
          type: string
          enum: [nozzle, nozzle2, bed, chamber]
        actual_temp:
          type: number
        target_temp:
          type: number
          nullable: true
        deviation:
          type: number
          nullable: true
          description: "Signed deviation from target (actual - target). Negative = undershoot, positive = overshoot."
        rate_of_change:
          type: number
          nullable: true
          description: Temperature change rate in degrees per second
        layer_num:
          type: integer
          nullable: true
        anomaly_type:
          type: string
          enum: [deviation, rate, both]
          description: What triggered this anomaly record

    JobPause:
      type: object
      properties:
        id:
          type: integer
        device_id:
          type: string
        job_id:
          type: integer
        paused_at:
          type: string
          format: date-time
        resumed_at:
          type: string
          format: date-time
          nullable: true
          description: Null if still paused or job ended while paused
        pause_source:
          type: string
          enum: [user, error, unknown]
          description: "What caused the pause: 'error' if HMS errors were active, 'user' otherwise"
        layer_num:
          type: integer
          nullable: true
        progress:
          type: number
          nullable: true
        hms_codes:
          type: string
          nullable: true
          description: JSON array of HMS code strings active at pause time

    AlertRule:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        enabled:
          type: integer
          description: "1 = enabled, 0 = disabled"
        device_id:
          type: string
          nullable: true
          description: Null = applies to all printers
        condition_type:
          type: string
        condition_config:
          type: object
        notify_via:
          type: string
        notify_config:
          type: object
        cooldown_sec:
          type: integer
        last_fired_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    AlertRuleInput:
      type: object
      required: [name, conditionType]
      properties:
        name:
          type: string
        deviceId:
          type: string
          nullable: true
        conditionType:
          type: string
          enum: [state_change, hms_error, temp_anomaly, temp_threshold, progress_stall, print_error, ams_humidity]
        conditionConfig:
          type: object
        notifyVia:
          type: string
          enum: [console, webhook, ntfy, pushover, telegram]
          default: console
        notifyConfig:
          type: object
          description: |
            Per channel — webhook `{url, format: generic|slack|discord}`; ntfy `{server?, topic, token?}`;
            pushover `{appToken, userKey}`; telegram `{botToken, chatId}`.
        cooldownSec:
          type: integer
          default: 300
